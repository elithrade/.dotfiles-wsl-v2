- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ["~", ~/.config]

- link:
    ~/.zshrc: zshrc
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.aliases.sh: aliases.sh
    ~/.history.zsh: history.zsh
    ~/.tmux.conf: tmux.conf
    ~/.config/starship.toml: starship.toml

- shell:
    - git submodule update --init --recursive
    - command: sudo apt update
      stdin: true
      stdout: true
    - command: sudo apt upgrade -y
      stdin: true
      stdout: true
    - command: sudo apt install -y make cmake gcc ripgrep unzip xclip
      stdin: true
      stdout: true
    # Neovim via bob (version manager)
    - command: ./install.bob
      stdin: true
      stdout: true
    # Neovim configs
    - command: "[ -d ~/.config/nvim ] || git clone https://github.com/elithrade/nvim-lazy.git ~/.config/nvim"
      stdin: true
      stdout: true
    # zsh plugin manager
    - command: "[ -d ~/.antidote ] || git clone --depth=1 https://github.com/mattmc3/antidote.git ~/.antidote"
      stdin: true
      stdout: true
    # Shell prompt
    - command: command -v starship >/dev/null || curl -sS https://starship.rs/install.sh | sh -s -- -y
      stdin: true
      stdout: true
    # Node version manager
    - command: "[ -d ~/.local/share/fnm ] || curl -fsSL https://fnm.vercel.app/install | bash -s -- --skip-shell"
      stdin: true
      stdout: true
    # Install fzf
    - command: "[ -d ~/.fzf ] || (git clone --depth 1 https://github.com/junegunn/fzf.git ~/.fzf && ~/.fzf/install --all)"
      stdin: true
      stdout: true
    # Better cd
    - command: command -v zoxide >/dev/null || curl -sS https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | bash
      stdin: true
      stdout: true
    # Git TUI
    - command: ./install.lazygit
      stdin: true
      stdout: true
    # Tmux plugin manager
    - command: "[ -d ~/.tmux/plugins/tpm ] || git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"
      stdin: true
      stdout: true
    # Tmux plugins listed in tmux.conf (same as prefix + I)
    - command: ~/.tmux/plugins/tpm/bin/install_plugins
      stdin: true
      stdout: true
